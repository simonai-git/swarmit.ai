name: Docker Images

on:
  push:
    branches: [main]
    paths: ['docker/**']
  workflow_dispatch:
    inputs:
      image:
        description: 'Which image to build (all, base, developer, frontend, backend, devops, qa, reviewer)'
        required: true
        default: 'all'

env:
  GHCR_REGISTRY: ghcr.io
  DOCKERHUB_REGISTRY: docker.io
  IMAGE_PREFIX: simonai-git/swarmit

jobs:
  build-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker/base
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_PREFIX }}-base:latest
            ghcr.io/${{ env.IMAGE_PREFIX }}-base:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/swarmit-base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-agents:
    needs: build-base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        agent: [developer, frontend, backend, devops, qa, reviewer]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker/${{ matrix.agent }}
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_PREFIX }}-${{ matrix.agent }}:latest
            ghcr.io/${{ env.IMAGE_PREFIX }}-${{ matrix.agent }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/swarmit-${{ matrix.agent }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
